          nullable: true
        currentPrice:
          type: number
        previousClose:
          type: number
          nullable: true
        open:
          type: number
          nullable: true
        dayLow:
          type: number
          nullable: true
        dayHigh:
          type: number
          nullable: true
        fiftyTwoWeekLow:
          type: number
          nullable: true
        fiftyTwoWeekHigh:
          type: number
          nullable: true
        volume:
          type: number
          nullable: true
        averageVolume3Month:
          type: number
          nullable: true
        beta:
          type: number
          nullable: true
        earningsTimestamp:
          type: number
          nullable: true
        targetMeanPrice:
          type: number
          nullable: true
        trailingEps:
          type: number
          nullable: true
        totalRevenue:
          type: number
