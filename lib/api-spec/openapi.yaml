openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stocks
    description: Stock analysis operations
  - name: eventArena
    description: Event Arena public leaderboard operations
paths:
  /event-arena/leaderboard-weeks:
    get:
      operationId: getEventArenaLeaderboardWeeks
      tags: [eventArena]
      summary: List completed Event Arena weeks with opted-in leaderboard entries
      responses:
        "200":
          description: Completed scheduled weeks that still have public leaderboard entries
          content:
            application/json:
              schema:
                type: object
                required: [weeks, updatedAt]
                properties:
                  weeks:
                    type: array
                    items:
                      type: object
                      required: [id, startAtMs, endAtMs, participantCount]
                      properties:
                        id:
                          type: string
                          format: date
                        startAtMs:
                          type: integer
                          description: Scheduled event start time in milliseconds since Unix epoch
                        endAtMs:
                          type: integer
                          description: Scheduled event end time in milliseconds since Unix epoch
                        participantCount:
                          type: integer
                          minimum: 1
                          description: Number of active participants who opted in
                  updatedAt:
                    type: string
                    format: date-time
        "500":
          description: Completed Event Arena weeks could not be loaded
  /event-arena/{eventId}/leaderboard:
    parameters:
      - in: path
        name: eventId
        required: true
        schema:
          type: string
          format: date
        description: Scheduled Event Arena event ID; results never include other events.
    get:
      operationId: getEventArenaLeaderboard
      tags: [eventArena]
      summary: Get active, opted-in scores for one Event Arena week
      description: Scores are self-reported. Ranking uses percentage return calculated from event equity and starting equity. Equal returns sort by most recently updated, then alias alphabetically, then a stable private participant identifier.
      parameters:
        - in: header
          name: X-Event-Arena-Installation-Id
          required: false
          schema:
            type: string
            minLength: 12
            maxLength: 128
          description: Anonymous device identifier used only to mark the requesting participant's row. It is never returned.
      responses:
        "200":
          description: Active scores for the requested event only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventArenaLeaderboardResponse"
        "400":
          description: The event ID is not a scheduled Event Arena week
        "500":
          description: The leaderboard could not be loaded
    post:
      operationId: submitEventArenaScore
      tags: [eventArena]
      summary: Submit or update an anonymous Event Arena score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventArenaScoreSubmission"
      responses:
        "200":
          description: Score saved
          content:
            application/json:
              schema:
                type: object
                required: [ok, updatedAt]
                properties:
                  ok: { type: boolean }
                  updatedAt: { type: string, format: date-time }
        "400":
          description: The score submission is invalid
        "409":
          description: The alias is locked for this event
        "410":
          description: The event has ended
        "429":
          description: The score was submitted too recently
  /event-arena/{eventId}/leaderboard/history:
    parameters:
      - in: path
        name: eventId
        required: true
        schema:
          type: string
          format: date
        description: Scheduled Event Arena event ID; history never includes other events.
    get:
      operationId: getEventArenaLeaderboardHistory
      tags: [eventArena]
      summary: Get the requesting participant's Event Arena rank history
      description: Returns sampled timestamped snapshots for the requesting anonymous installation only. Scores and ranks are self-reported and not independently verified.
      parameters:
        - in: header
          name: X-Event-Arena-Installation-Id
          required: true
          schema:
            type: string
            minLength: 12
            maxLength: 128
          description: Anonymous device identifier used to look up only the requesting participant's history; it is never returned.
      responses:
        "200":
          description: Sampled rank and percentage-return history for the participant in this event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventArenaLeaderboardHistoryResponse"
        "400":
          description: The event or anonymous installation ID is invalid
        "500":
          description: The participant history could not be loaded
  /event-arena/{eventId}/transfers:
    parameters:
      - in: path
        name: eventId
        required: true
        schema:
          type: string
          format: date
    post:
      operationId: sendEventArenaCash
      tags: [eventArena]
      summary: Send simulated cash to an eligible participant in the active event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventArenaCashTransferRequest"
      responses:
        "200":
          description: Transfer recorded once for the event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventArenaCashTransferResponse"
        "400":
          description: The request is invalid or the sender selected themselves
        "403":
          description: The sender is not an eligible event participant
        "404":
          description: The recipient is not an eligible participant in this event
        "409":
          description: The amount exceeds available event cash
        "410":
          description: The event is not active
    get:
      operationId: getEventArenaCashNotifications
      tags: [eventArena]
      summary: List incoming event cash transfers and optionally mark them read
      parameters:
        - in: header
          name: X-Event-Arena-Installation-Id
          required: true
          schema:
            type: string
            minLength: 12
            maxLength: 128
          description: Anonymous recipient device identifier; it is never returned.
        - in: header
          name: X-Event-Arena-Mark-Read
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Incoming cash notifications for this event only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventArenaCashNotificationsResponse"
        "400":
          description: The event or installation ID is invalid
  /stocks/heat-map/search:
    get:
      operationId: searchHeatMapInstruments
      tags: [stocks]
      summary: Search supported non-stock heat-map instruments by name or ticker
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
        - in: query
          name: category
          required: true
          schema:
            type: string
            enum: [etfs, commodities, futures, cryptocurrency]
      responses:
        "200":
          description: Matching provider-supported instruments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeatMapInstrumentSuggestion"
        "400":
          description: Search text or category is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "502":
          description: The upstream instrument search is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stocks/chart/{symbol}/{period}/{interval}:
    get:
      operationId: getStockChart
      tags: [stocks]
      summary: Retrieve provider chart history and adjusted-return data
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
        - in: path
          name: period
          required: true
          schema:
            type: string
            enum: [5d, 1mo, 3mo, 6mo, 1y, 2y, 3y, 5y, max]
        - in: path
          name: interval
          required: true
          schema:
            type: string
            enum: [15m, 1h, 1d, 1wk]
      responses:
        "200":
          description: Provider chart candles and a strictly provider-backed adjusted-return series
          content:
            application/json:
              schema:
                type: object
                required: [symbol, period, interval, candles, adjustedReturnSeries]
                properties:
                  symbol:
                    type: string
                  period:
                    type: string
                  interval:
                    type: string
                  candles:
                    type: array
                    items:
                      type: object
                      required: [t, date, o, h, l, c, adjClose, dividend, v]
                      properties:
                        t:
                          type: integer
                        date:
                          type: string
                          format: date
                        o:
                          type: number
                        h:
                          type: number
                        l:
                          type: number
                        c:
                          type: number
                          description: Raw provider Close; not automatically adjusted by this endpoint.
                        adjClose:
                          type: number
                          nullable: true
                          description: Provider Adj Close when explicitly supplied.
                        dividend:
                          type: number
                          nullable: true
                          description: Provider cash distribution for this date, or null when unavailable.
                        v:
                          type: integer
                        ma20:
                          type: number
                          nullable: true
                        ma50:
                          type: number
                          nullable: true
                        ma200:
                          type: number
                          nullable: true
                  adjustedReturnSeries:
                    type: object
                    required: [status, method, values, reason]
                    properties:
                      status:
                        type: string
                        enum: [available, unavailable]
                      method:
                        type: string
                        enum: [provider_adjusted_close]
                        description: Cumulative return from the first observation, calculated from provider Adj Close.
                      values:
                        type: array
                        description: Empty unless every candle has a valid adjusted close and reported distribution value.
                        items:
                          type: object
                          required: [date, returnPercent]
                          properties:
                            date:
                              type: string
                              format: date
                            returnPercent:
                              type: number
                              description: Cumulative adjusted return in percentage points from the first observation.
                      reason:
                        type: string
                        nullable: true
        "400":
          description: Invalid symbol, period, or interval
        "422":
          description: Provider history could not be retrieved
  /stocks/commodity-relationships/{relationshipId}/{period}:
    get:
      operationId: getCommodityRelationship
      tags: [stocks]
      summary: Compare dated commodity market relationships
      description: Returns strictly date-aligned commodity price comparisons, relative performance, return correlations, reproducible divergence checks, and optional AI interpretation. Correlation is descriptive and does not establish causation.
      parameters:
        - in: path
          name: relationshipId
          required: true
          schema:
            type: string
            enum: [gold-silver, gold-dollar, copper-gold, oil-gold, gold-silver-ratio]
        - in: path
          name: period
          required: true
          schema:
            type: string
            enum: [1mo, 3mo, 6mo, 1y, 5y, max]
      responses:
        "200":
          description: Calculated relationship statistics from matched provider trading dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommodityRelationshipResponse"
        "400":
          description: Unsupported relationship or history range
        "422":
          description: Relationship history could not be retrieved
  /stocks/search:
    get:
      operationId: searchStockSymbols
      tags: [stocks]
      summary: Search stocks by company name or ticker
      description: Returns matching listed equities for company-name and ticker autocomplete
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Matching stock symbols
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockSymbolSuggestion"
        "400":
          description: Search text is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "502":
          description: The upstream company search is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/analyze:
    post:
      operationId: analyzeStock
      tags: [stocks]
      summary: Analyze a listed ticker or supported commodity
      description: Returns deterministic score-and-factor market analysis for supported commodity futures, fund-specific analysis for ETFs, or stock analysis for listed equities.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeStockRequest"
      responses:
        "200":
          description: Stock, ETF, or supported commodity analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Invalid symbol or request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "422":
          description: Could not analyze stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/info/{symbol}:
    get:
      operationId: getStockInfo
      tags: [stocks]
      summary: Get market detail statistics for a symbol
      description: Returns provider-backed quote statistics and, for ETFs, fund facts and historical market-regime comparisons.
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 15
      responses:
        "200":
          description: Market detail statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketInstrumentInfo"
        "400":
          description: Symbol is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "422":
          description: Provider data is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/crypto/{symbol}/supply-history/{rangeDays}:
    get:
      operationId: getCryptoSupplyHistory
      tags: [stocks]
      summary: Get historical on-chain supply for a cryptocurrency
      description: Returns daily Coin Metrics current-supply observations for a selected 30, 90, or 365 day window. Missing provider dates are omitted, never interpolated; this on-chain metric may differ from another provider's current circulating-supply figure.
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
            minLength: 5
            maxLength: 15
            pattern: "^[A-Z0-9]+-USD$"
        - in: path
          name: rangeDays
          required: true
          description: Number of daily history days to return.
          schema:
            type: integer
            enum: [30, 90, 365]
      responses:
        "200":
          description: Daily provider history, or an empty point list when the provider has no history for this asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoSupplyHistory"
        "400":
          description: Symbol is invalid or the requested history window is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "422":
          description: Historical supply provider is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/market-breadth:
    get:
      operationId: getMarketBreadth
      tags: [stocks]
      summary: Get a fast stock-market breadth snapshot
      description: Returns the regular-session daily price changes for the same active-stock sample as the heat map, without fetching historical series or volatility data.
      responses:
        "200":
          description: Current market breadth quotes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatMapResponse"
        "422":
          description: Market breadth is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/quotes:
    post:
      operationId: getPortfolioQuotes
      tags: [stocks]
      summary: Get current quotes for portfolio holdings
      description: Returns current quotes using the same provider and session-price selection as the single-symbol quote route. Symbols without an available quote are listed separately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioQuoteBatchRequest"
      responses:
        "200":
          description: Available quotes and symbols without quote data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioQuoteBatch"
        "400":
          description: Invalid symbol list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "422":
          description: Quote provider is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/market-pulse:
    get:
      operationId: getMarketPulse
      tags: [stocks]
      summary: Get the total-market daily move
      description: Returns the daily percentage change and quote timestamp for Yahoo Finance's Dow Jones U.S. Total Stock Market Index (^DWCF), plus whether the official XNYS regular session is open. The index price is not returned.
      responses:
        "200":
          description: Total-market daily percentage move
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPulseResponse"
        "422":
          description: Market pulse is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/heat-map:
    get:
      operationId: getMarketHeatMap
      tags: [stocks]
      summary: Get batched quotes for a market heat map
      description: Returns a cached batch of quotes, selected-period returns, and available provider metadata for one heat-map category. Custom maps pass symbols as a comma-separated query array.
      parameters:
        - in: query
          name: category
          required: true
          schema:
            type: string
            enum: [stocks, etfs, commodities, futures, cryptocurrency, custom]
        - in: query
          name: period
          required: false
          schema:
            type: string
            enum: [1d, 1w, 1m, 3m, 6m, 1y, 3y, 5y, max]
            default: 1d
          description: Return window. Risk levels always use trailing-year annualized daily volatility.
        - in: query
          name: sector
          required: false
          schema:
            type: string
            enum: [Technology, Communication Services, Consumer Cyclical, Consumer Defensive, Financials, Healthcare, Industrials, Real Estate, Energy, Utilities, Basic Materials]
          description: For Stocks, fetch an expanded, liquid US-listed quote set for the selected sector.
        - in: query
          name: symbols
          required: false
          style: form
          explode: false
          schema:
            type: array
            maxItems: 40
            items:
              type: string
              minLength: 1
              maxLength: 15
      responses:
        "200":
          description: Market quotes for the selected heat map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatMapResponse"
        "400":
          description: Invalid category or custom ticker list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "422":
          description: Market data is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/heat-map/validate:
    post:
      operationId: validateHeatMapSymbol
      tags: [stocks]
      summary: Validate a custom heat-map ticker against live market data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateHeatMapSymbolRequest"
      responses:
        "200":
          description: Valid ticker with an available quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatMapQuote"
        "400":
          description: Invalid ticker syntax
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "422":
          description: No current or recent quote was found, or market data is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
components:
  schemas:
    EventArenaScoreSubmission:
      type: object
      required: [installationId, alias, startEquity, equity, returnPercent, tradeCount, holdings, eventStartAtMs, eventEndAtMs]
      properties:
        installationId:
          type: string
          minLength: 12
          maxLength: 128
          description: Anonymous device identifier; never returned by leaderboard reads.
        alias:
          type: string
          minLength: 1
          maxLength: 24
        cashBalance:
          type: number
          minimum: 0
          description: Self-reported cash in the separate event account, used to reconcile transfer receipts.
        appliedTransferIds:
          type: array
          maxItems: 500
          items: { type: string, minLength: 8, maxLength: 96, pattern: "^[A-Za-z0-9_-]+$" }
          description: Event transfer references already applied to the local account cash balance.
        startEquity: { type: number, exclusiveMinimum: 0 }
        equity: { type: number, minimum: 0 }
        returnPercent:
          type: number
          description: Percentage return from event equity and starting equity; the server recalculates it.
        tradeCount:
          type: integer
          minimum: 0
          description: Count of trades in the event account during this event.
        holdings:
          type: array
          maxItems: 100
          items:
            type: object
            required: [symbol, companyName, allocationPercent, side]
            properties:
              symbol: { type: string }
              companyName: { type: string }
              allocationPercent:
                type: number
                nullable: true
                minimum: 0
                description: Absolute market exposure as a percentage of reported Event Arena account equity; null when unavailable.
              side:
                type: string
                enum: [long, short]
        eventStartAtMs: { type: integer }
        eventEndAtMs: { type: integer }

    EventArenaLeaderboardResponse:
      type: object
      required: [entries, updatedAt]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [rank, alias, participantToken, startEquity, equity, profitLoss, returnPercent, tradeCount, holdings, updatedAt, isCurrentUser]
            properties:
              rank: { type: integer, minimum: 1 }
              alias: { type: string }
              participantToken:
                type: string
                minLength: 16
                maxLength: 96
                description: Random event-scoped recipient token; never the anonymous installation ID.
              startEquity: { type: number }
              equity: { type: number }
              profitLoss: { type: number, description: Event equity minus starting equity. }
              returnPercent: { type: number, description: Percentage return calculated from event equity and starting equity. }
              tradeCount: { type: integer, nullable: true, minimum: 0 }
              holdings:
                type: array
                items:
                  type: object
                  required: [symbol, companyName, allocationPercent, side]
                  properties:
                    symbol: { type: string }
                    companyName: { type: string }
                    allocationPercent:
                      type: number
                      nullable: true
                      minimum: 0
                      description: Self-reported absolute market exposure as a percentage of reported Event Arena account equity; null when unavailable.
                    side:
                      type: string
                      enum: [long, short]
              updatedAt: { type: string, format: date-time }
              isCurrentUser:
                type: boolean
                description: True only for the requesting installation's row; no installation ID is returned.
        updatedAt: { type: string, format: date-time }

    EventArenaLeaderboardHistoryResponse:
      type: object
      required: [snapshots]
      properties:
        snapshots:
          type: array
          maxItems: 120
          items:
            type: object
            required: [capturedAt, rank, returnPercent]
            properties:
              capturedAt: { type: string, format: date-time }
              rank: { type: integer, minimum: 1 }
              returnPercent: { type: number, description: Self-reported percentage return at this snapshot. }

    EventArenaCashTransferRequest:
      type: object
      required: [installationId, recipientParticipantToken, amount, availableCash, idempotencyKey]
      properties:
        installationId:
          type: string
          minLength: 12
          maxLength: 128
          description: Anonymous sender installation ID; never returned in public responses.
        recipientParticipantToken:
          type: string
          minLength: 16
          maxLength: 96
        amount: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        availableCash: { type: number, minimum: 0, maximum: 10000000 }
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 96
          pattern: "^[A-Za-z0-9_-]+$"
    EventArenaCashTransferResponse:
      type: object
      required: [ok, transfer]
      properties:
        ok: { type: boolean }
        transfer:
          type: object
          required: [id, eventId, senderAlias, recipientAlias, amount, createdAt]
          properties:
            id: { type: string }
            eventId: { type: string, format: date }
            senderAlias: { type: string }
            recipientAlias: { type: string }
            amount: { type: number, exclusiveMinimum: 0 }
            createdAt: { type: string, format: date-time }
    EventArenaCashNotificationsResponse:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items:
            type: object
            required: [id, eventId, senderAlias, amount, createdAt, readAt]
            properties:
              id: { type: string }
              eventId: { type: string, format: date }
              senderAlias: { type: string }
              amount: { type: number, exclusiveMinimum: 0 }
              createdAt: { type: string, format: date-time }
              readAt: { type: string, format: date-time, nullable: true }

    CommodityRelationshipInstrument:
      type: object
      required: [symbol, name, unit, venue]
      properties:
        symbol: { type: string }
        name: { type: string }
        unit: { type: string }
        venue: { type: string }
        proxy: { type: boolean }

    CommodityRelationshipResponse:
      type: object
      required: [relationship, period, status, reason, method, coverage, metrics, historyRanks, rankTrend, rankTrends, divergence, points, sources, aiInterpretation]
      properties:
        relationship:
          type: object
          required: [id, label, mode, first, second, relativeValueLabel]
          properties:
            id: { type: string }
            label: { type: string }
            mode: { type: string, enum: [pair, ratio] }
            first: { $ref: "#/components/schemas/CommodityRelationshipInstrument" }
            second: { $ref: "#/components/schemas/CommodityRelationshipInstrument" }
            relativeValueLabel: { type: string }
        period: { type: string, enum: [1mo, 3mo, 6mo, 1y, 5y, max] }
        status: { type: string, enum: [available, unavailable] }
        reason: { type: string, nullable: true }
        method:
          type: object
          required: [alignment, correlation, correlationChange, divergence, relativeValuePercentile]
          properties:
            alignment: { type: string }
            correlation: { type: string }
            correlationChange: { type: string }
            divergence: { type: string }
            relativeValuePercentile: { type: string }
        coverage:
          type: object
          required: [firstStartDate, firstEndDate, secondStartDate, secondEndDate, matchedStartDate, matchedEndDate, matchedObservations, returnObservations]
          properties:
            firstStartDate: { type: string, format: date, nullable: true }
            firstEndDate: { type: string, format: date, nullable: true }
            secondStartDate: { type: string, format: date, nullable: true }
            secondEndDate: { type: string, format: date, nullable: true }
            matchedStartDate: { type: string, format: date, nullable: true }
            matchedEndDate: { type: string, format: date, nullable: true }
            matchedObservations: { type: integer }
            returnObservations: { type: integer }
        metrics:
          type: object
          required: [currentRelativeValue, firstPeriodReturnPercent, secondPeriodReturnPercent, relativeStrengthPercentagePoints, correlation, previousCorrelation, correlationChange, currentRelativeValuePercentile]
          properties:
            currentRelativeValue: { type: number, nullable: true }
            firstPeriodReturnPercent: { type: number, nullable: true }
            secondPeriodReturnPercent: { type: number, nullable: true }
            relativeStrengthPercentagePoints: { type: number, nullable: true }
            correlation: { type: number, nullable: true }
            previousCorrelation: { type: number, nullable: true }
            correlationChange: { type: number, nullable: true }
            currentRelativeValuePercentile: { type: number, nullable: true, minimum: 0, maximum: 100 }
        historyRanks:
          type: array
          description: Historical relative-value ranks for supported windows, populated for the gold/silver ratio.
          items:
            type: object
            required: [period, percentile, matchedObservations, matchedStartDate, matchedEndDate]
            properties:
              period: { type: string, enum: [1mo, 3mo, 6mo, 1y, 5y, max] }
              percentile: { type: number, nullable: true, minimum: 0, maximum: 100 }
              matchedObservations: { type: integer, minimum: 0 }
              matchedStartDate: { type: string, format: date, nullable: true }
              matchedEndDate: { type: string, format: date, nullable: true }
        rankTrend:
          $ref: "#/components/schemas/CommodityRelationshipRankTrend"
        rankTrends:
          type: array
          description: Rolling historical percentile ranks for supported windows, populated for the gold/silver ratio.
          items:
            $ref: "#/components/schemas/CommodityRelationshipRankTrend"
        divergence:
          type: object
          required: [status, firstWindowReturnPercent, secondWindowReturnPercent, reason]
          properties:
            status: { type: string, enum: [detected, not_detected, unavailable] }
            firstWindowReturnPercent: { type: number, nullable: true }
            secondWindowReturnPercent: { type: number, nullable: true }
            reason: { type: string }
        points:
          type: array
          items:
            type: object
            required: [date, timestamp, firstClose, secondClose, firstReturnPercent, secondReturnPercent, relativeValue, firstNormalizedPercent, secondNormalizedPercent, rollingCorrelation]
            properties:
              date: { type: string, format: date }
              timestamp: { type: integer }
              firstClose: { type: number }
              secondClose: { type: number }
              firstReturnPercent: { type: number }
              secondReturnPercent: { type: number }
              relativeValue: { type: number }
              firstNormalizedPercent: { type: number }
              secondNormalizedPercent: { type: number }
              rollingCorrelation: { type: number, nullable: true }
        sources:
          type: object
          required: [provider, retrievedAt, firstLatestTimestamp, secondLatestTimestamp, latestObservationTimestamp, alignmentNote]
          properties:
            provider: { type: string, enum: [Yahoo Finance] }
            retrievedAt: { type: string, format: date-time }
            firstLatestTimestamp: { type: integer, nullable: true }
            secondLatestTimestamp: { type: integer, nullable: true }
            latestObservationTimestamp: { type: integer, nullable: true }
            alignmentNote: { type: string }
        aiInterpretation:
          type: object
          required: [status, text]
          properties:
            status: { type: string, enum: [available, unavailable] }
            text: { type: string, nullable: true }

    CommodityRelationshipRankTrend:
