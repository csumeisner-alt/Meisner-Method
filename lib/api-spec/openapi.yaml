    AnalysisResult:
      oneOf:
        - $ref: "#/components/schemas/StockAnalysis"
        - $ref: "#/components/schemas/EtfAnalysisResult"
        - $ref: "#/components/schemas/CommodityAnalysisResult"
      discriminator:
        propertyName: assetType
        mapping:
          stock: "#/components/schemas/StockAnalysis"
          etf: "#/components/schemas/EtfAnalysisResult"
          commodity: "#/components/schemas/CommodityAnalysisResult"

    CommodityAnalysisResult:
      type: object
      properties:
        assetType: { type: string, enum: [commodity] }
        symbol: { type: string }
        companyName: { type: string }
        exchange: { type: string }
        currency: { type: string }
        currentPrice: { type: number }
        priceChange: { type: number }
        priceChangePercent: { type: number }
        volume: { type: number }
        marketCap: { type: number, nullable: true }
        week52High: { type: number }
        week52Low: { type: number }
        commodityAnalysis:
          type: object
          properties:
            score: { type: integer, minimum: 0, maximum: 100 }
            confidence: { type: integer, minimum: 0, maximum: 100 }
            dataCoveragePercent: { type: integer, minimum: 0, maximum: 100 }
            observationCount: { type: integer, minimum: 0 }
            historyAsOf: { type: string, nullable: true }
            family: { type: string, enum: [metals, energy, agriculture, livestock] }
            annualizedVolatilityPercent: { type: number }
            oneMonthReturnPercent: { type: number, nullable: true }
            threeMonthReturnPercent: { type: number, nullable: true }
            sixMonthReturnPercent: { type: number, nullable: true }
            intelligenceScorecard:
              type: object
              description: Evidence-based present assessment, distinct from a forecast of future returns.
              properties:
                version: { type: integer, enum: [1] }
                score: { type: integer, minimum: 0, maximum: 100 }
                coveragePercent: { type: integer, minimum: 0, maximum: 100 }
                coverageStatus: { type: string, enum: [complete, partial, insufficient] }
                missingCategories: { type: array, items: { type: string } }
                categories:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string, enum: [technical-momentum, fundamentals, supply-demand, market-environment, risk-volatility] }
                      label: { type: string }
                      score: { type: integer, minimum: 0, maximum: 100, nullable: true }
                      weight: { type: integer, minimum: 0, maximum: 100 }
                      classification: { type: string, enum: [bullish, bearish, neutral, unavailable] }
                      detail: { type: string }
                      methodology: { type: string }
                      sources:
                        type: array
                        items:
                          type: object
                          properties:
                            title: { type: string }
                            url: { type: string }
                            asOf: { type: string, format: date }
                            unit: { type: string }
                            observation: { type: string }
                          required: [title, url, asOf, unit, observation]
                    required: [id, label, score, weight, classification, detail, methodology, sources]
                positiveContributors: { type: array, items: { type: string } }
                negativeContributors: { type: array, items: { type: string } }
                methodology: { type: string }
              required: [version, score, coveragePercent, coverageStatus, missingCategories, categories, positiveContributors, negativeContributors, methodology]
            factors:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  label: { type: string }
                  status: { type: string, enum: [available, unavailable] }
                  score: { type: integer, nullable: true }
                  weight: { type: number }
                  detail: { type: string }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        url: { type: string }
                        asOf: { type: string, format: date }
                        unit: { type: string }
                        observation: { type: string }
                      required: [title, url, asOf, unit, observation]
                required: [key, label, status, score, weight, detail, sources]
            methodology: { type: string }
            reasoning: { type: string }
            risks: { type: array, items: { type: string } }
            strengths: { type: array, items: { type: string } }
            analysisGuide:
              type: object
              properties:
                focus: { type: array, items: { type: string } }
                unavailable: { type: array, items: { type: string } }
                monitorNext: { type: array, items: { type: string } }
              required: [focus, unavailable, monitorNext]
            verifiedEvidence:
              type: array
              description: Validated source observations available to ground commentary.
              items:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string }
                  url: { type: string }
                  asOf: { type: string, format: date }
                  unit: { type: string }
                  observation: { type: string }
                  kind: { type: string, enum: [market-data, news] }
                  eventDate: { type: string, format: date, nullable: true }
                required: [id, title, url, asOf, unit, observation, kind, eventDate]
            commentary:
              type: object
              description: Optional AI interpretation; every item references verified evidence IDs.
              properties:
                status: { type: string, enum: [available, unavailable] }
                currentDrivers: { type: array, items: { $ref: "#/components/schemas/CommodityCommentaryItem" } }
                strongestBullishFactors: { type: array, items: { $ref: "#/components/schemas/CommodityCommentaryItem" } }
                strongestBearishFactors: { type: array, items: { $ref: "#/components/schemas/CommodityCommentaryItem" } }
                technicalAlignment: { oneOf: [{ $ref: "#/components/schemas/CommodityCommentaryItem" }, { type: "null" }] }
                upcomingCatalysts: { type: array, items: { $ref: "#/components/schemas/CommodityCommentaryItem" } }
                risks: { type: array, items: { $ref: "#/components/schemas/CommodityCommentaryItem" } }
                monitorNext: { type: array, items: { type: string } }
              required: [status, currentDrivers, strongestBullishFactors, strongestBearishFactors, technicalAlignment, upcomingCatalysts, risks, monitorNext]
            newsContext:
              type: object
              properties:
                status: { type: string, enum: [available, unavailable] }
                summary: { type: string, nullable: true }
                retrievedAt: { type: string, nullable: true }
                sources:
                  type: array
                  items:
                    type: object
                    properties:
                      title: { type: string }
                      url: { type: string }
                      publishedAt: { type: string, nullable: true }
                    required: [title, url, publishedAt]
              required: [status, summary, retrievedAt, sources]
            eventCalendar:
              type: object
              description: Dated events from verified official schedules. Null values are not estimated or inferred.
              properties:
                status: { type: string, enum: [available, partial, unavailable] }
                checkedAt: { type: string, format: date-time }
                events:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      eventDate: { type: string, format: date }
                      time: { type: string, nullable: true }
                      timezone: { type: string, nullable: true }
                      status: { type: string, enum: [upcoming, completed] }
                      affectedCommodities: { type: array, items: { type: string } }
                      source:
                        type: object
                        properties:
                          title: { type: string }
                          url: { type: string, pattern: "^https://" }
                          publicationDate: { type: string, format: date, nullable: true }
                        required: [title, url, publicationDate]
                      values:
                        type: object
                        properties:
                          previous: { $ref: "#/components/schemas/CommodityPublishedValue" }
                          consensus: { $ref: "#/components/schemas/CommodityPublishedValue" }
                          actual: { $ref: "#/components/schemas/CommodityPublishedValue" }
                        required: [previous, consensus, actual]
                    required: [id, name, eventDate, time, timezone, status, affectedCommodities, source, values]
                unavailable: { type: array, items: { type: string } }
              required: [status, checkedAt, events, unavailable]
            supplyDemand:
              type: object
              description: Validated official supply and demand observations; unsupported series remain unavailable.
              properties:
                status: { type: string, enum: [available, partial, unavailable] }
                commodity: { type: string }
                series:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string, enum: [inventory, production, consumption, imports, exports] }
                      label: { type: string }
                      status: { type: string, enum: [available, unavailable] }
                      units: { type: string, nullable: true }
                      points:
                        type: array
                        items:
                          type: object
                          properties:
                            commodity: { type: string }
                            value: { type: number }
                            units: { type: string }
                            reportingPeriod: { type: string }
                            publicationDate: { type: string, format: date }
                            revisionDate: { type: string, format: date }
                            source:
                              type: object
                              properties:
                                title: { type: string }
                                url: { type: string, pattern: "^https://" }
                              required: [title, url]
                          required: [commodity, value, units, reportingPeriod, publicationDate, source]
                      historicalAverage: { type: number, nullable: true }
                      historicalAveragePeriod: { type: string, nullable: true }
                      reason: { type: string, nullable: true }
                    required: [id, label, status, units, points, historicalAverage, historicalAveragePeriod, reason]
              required: [status, commodity, series]
            provider: { type: string }
          required: [score, confidence, dataCoveragePercent, observationCount, historyAsOf, family, annualizedVolatilityPercent, oneMonthReturnPercent, threeMonthReturnPercent, sixMonthReturnPercent, intelligenceScorecard, factors, methodology, reasoning, risks, strengths, analysisGuide, verifiedEvidence, commentary, newsContext, eventCalendar, supplyDemand, provider]
      required: [assetType, symbol, companyName, exchange, currency, currentPrice, priceChange, priceChangePercent, volume, marketCap, week52High, week52Low, commodityAnalysis]

    CommodityPublishedValue:
      oneOf:
        - type: object
          properties:
            value: { type: number }
            upperBound: { type: number }
            units: { type: string }
            annualRate:
              type: object
              nullable: true
              properties:
                value: { type: number }
                units: { type: string }
                source:
                  type: object
                  properties:
                    title: { type: string }
                    url: { type: string, pattern: "^https://" }
                    publicationDate: { type: string, format: date }
                  required: [title, url, publicationDate]
              required: [value, units, source]
            source:
              type: object
              properties:
                title: { type: string }
                url: { type: string, pattern: "^https://" }
                publicationDate: { type: string, format: date }
              required: [title, url, publicationDate]
          required: [value, units]
