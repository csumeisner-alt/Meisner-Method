        - beta
        - earningsTimestamp
        - targetMeanPrice
        - trailingEps
        - totalRevenue
        - circulatingSupply
        - maxSupply
        - volume24Hr

    EtfProfile:
      type: object
      description: Provider-reported fund facts, present for ETFs. Ratios and weights are decimal fractions.
      properties:
        fundCategory:
          type: string
          nullable: true
        fundFamily:
          type: string
          nullable: true
        expenseRatio:
          type: number
          nullable: true
          description: Annual expense ratio as a decimal fraction (0.001 = 0.1%).
        totalAssets:
          type: number
          nullable: true
          description: Fund assets under management in USD.
        dividendYield:
          type: number
          nullable: true
        beta3Year:
          type: number
          nullable: true
        largestSector:
          type: string
          nullable: true
        largestSectorWeight:
          type: number
          nullable: true
        sectorWeights:
          type: array
          description: Provider-reported sector weights only; omitted sectors are not inferred as zero.
          items:
            $ref: "#/components/schemas/EtfSectorWeight"
        sectorWeightsRetrievedAt:
          type: string
          format: date-time
          description: Provider sector snapshot retrieval time, not a sector report date.
        topHoldings:
          type: array
          items:
            $ref: "#/components/schemas/EtfHolding"
        topHoldingsReportedCount:
          type: integer
          minimum: 0
          description: Number of positions reported by the provider for this holdings snapshot.
        topHoldingsRetrievedAt:
          type: string
          format: date-time
          description: Provider holdings snapshot retrieval time, not a holdings report date.
        marketRegime:
          allOf:
            - $ref: "#/components/schemas/EtfMarketRegime"
          nullable: true
        benchmark:
          allOf:
            - $ref: "#/components/schemas/EtfBenchmarkReference"
          nullable: true
        trackingComparison:
          allOf:
            - $ref: "#/components/schemas/EtfTrackingComparison"
          nullable: true
        peerExpenseComparison:
          allOf:
            - $ref: "#/components/schemas/EtfPeerExpenseComparison"
          nullable: true
        peerAssetSizeComparison:
          allOf:
            - $ref: "#/components/schemas/EtfPeerAssetSizeComparison"
          nullable: true
      required:
        - fundCategory
        - fundFamily
        - expenseRatio
        - totalAssets
        - dividendYield
        - beta3Year
        - largestSector
        - largestSectorWeight
        - sectorWeights
        - sectorWeightsRetrievedAt
        - topHoldings
        - topHoldingsReportedCount
        - topHoldingsRetrievedAt
        - marketRegime
        - benchmark
        - trackingComparison
        - peerExpenseComparison
        - peerAssetSizeComparison

    EtfBenchmarkReference:
      type: object
      description: Benchmark explicitly identified by the provider; never inferred from the ETF category.
      properties:
        symbol: { type: string }
        name: { type: string }
        source: { type: string }
        asOf: { type: string, format: date-time }
      required: [symbol, name, source, asOf]

    EtfTrackingComparison:
      type: object
      description: Comparison of adjusted monthly ETF and explicit benchmark returns over their shared history.
      properties:
        periodStart: { type: string }
        periodEnd: { type: string }
        monthlySamples: { type: integer, minimum: 2 }
        fundAnnualizedReturn: { type: number }
        benchmarkAnnualizedReturn: { type: number }
        trackingDifference:
          type: number
          description: Fund annualized total return minus benchmark annualized total return.
        trackingError:
          type: number
          description: Sample standard deviation of monthly active returns, annualized by the square root of 12.
        source: { type: string }
        asOf: { type: string, format: date-time }
      required: [periodStart, periodEnd, monthlySamples, fundAnnualizedReturn, benchmarkAnnualizedReturn, trackingDifference, trackingError, source, asOf]

    EtfPeerExpenseComparison:
      type: object
      description: Yahoo Finance provider-defined fund-category average; sample size is unavailable when not reported.
      properties:
        category: { type: string }
        fundExpenseRatio:
          type: number
          nullable: true
          description: Fund annual expense ratio as a decimal fraction.
        categoryAverageExpenseRatio:
          type: number
          description: Category-average annual expense ratio as a decimal fraction.
        difference:
          type: number
          nullable: true
          description: Fund expense ratio minus the category average, as a decimal fraction.
        sampleSize:
          type: integer
          nullable: true
        sampleContext: { type: string }
        source: { type: string }
        asOf: { type: string, format: date-time }
      required: [category, fundExpenseRatio, categoryAverageExpenseRatio, difference, sampleSize, sampleContext, source, asOf]

    EtfPeerAssetSizeComparison:
      type: object
      description: Yahoo Finance provider-defined category average total net assets; sample size is unavailable when not reported.
      properties:
        category: { type: string }
        fundTotalAssets:
          type: number
          nullable: true
          description: Fund total net assets in USD.
        categoryAverageTotalAssets:
          type: number
          description: Category-average total net assets in USD.
        difference:
          type: number
          nullable: true
          description: Fund total assets minus the category average, in USD.
        sampleSize:
          type: integer
          nullable: true
        sampleContext: { type: string }
        source: { type: string }
        asOf: { type: string, format: date-time }
      required: [category, fundTotalAssets, categoryAverageTotalAssets, difference, sampleSize, sampleContext, source, asOf]

    EtfHolding:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        weight:
          type: number
          description: Holding weight as a decimal fraction.
      required:
        - symbol
        - name
        - weight

    EtfSectorWeight:
      type: object
      properties:
        sector:
          type: string
        weight:
          type: number
          minimum: 0
          maximum: 1
          description: Provider-reported sector weight as a decimal fraction.
      required: [sector, weight]

    EtfMarketRegime:
      type: object
      description: Historical comparison, not a forecast. Based on complete calendar-year adjusted total returns.
      properties:
        bestRegime:
          type: string
          enum: [bull, bear, mixed]
          nullable: true
        lookbackYears:
          type: integer
        firstYear:
          type: integer
        lastYear:
          type: integer
        benchmarkSymbol:
          type: string
        bullThreshold:
          type: number
          description: Minimum annual benchmark return for a bull year, as a decimal fraction.
        bearThreshold:
          type: number
          description: Maximum annual benchmark return for a bear year, as a decimal fraction.
        periods:
          type: object
          properties:
            bull:
              $ref: "#/components/schemas/EtfRegimePeriod"
            bear:
              $ref: "#/components/schemas/EtfRegimePeriod"
            mixed:
              $ref: "#/components/schemas/EtfRegimePeriod"
          required: [bull, bear, mixed]
      required:
        - bestRegime
        - lookbackYears
        - firstYear
        - lastYear
        - benchmarkSymbol
        - bullThreshold
        - bearThreshold
        - periods

    EtfRegimePeriod:
      type: object
      properties:
        averageAnnualReturn:
          type: number
          nullable: true
          description: Arithmetic average of adjusted annual total returns.
        years:
          type: integer
          description: Number of complete calendar years in this regime.
      required:
        - averageAnnualReturn
        - years

    HeatMapQuote:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
          exclusiveMinimum: 0
        priceChangePercent:
          type: number
          description: Percentage change from the previous close, in percentage points (1.25 means 1.25%).
        returnPercent:
          type: number
          nullable: true
          description: Selected-period return in percentage points, or null when the requested history is unavailable.
        returnBasis:
          type: string
          enum: [adjusted_total_return, price_return_proxy]
          description: Adjusted total return for stocks/ETFs where supported, otherwise a price-return proxy.
        returnUnavailableReason:
          type: string
          nullable: true
          description: Why the requested return could not be calculated.
        historyStartDate:
          type: string
          nullable: true
          description: Earliest available daily observation in YYYY-MM-DD; populated for Max.
        priceTimestamp:
          type: integer
          nullable: true
          description: Unix timestamp in seconds for this quote or last available close. Quotes without a timestamp are not displayable.
        marketSession:
          type: string
          enum: [pre_market, regular, after_hours, closed, unknown]
          description: Session for this quote. closed identifies the latest available close; unknown means the provider could not identify the session.
        nextRegularOpenTimestamp:
          type: integer
          nullable: true
          description: Unix timestamp in seconds for the next scheduled listed-exchange regular-session open, populated only when a stock or ETF is closed or in after-hours; null when unavailable or not applicable.
        assetType:
          type: string
          enum: [stock, etf, commodity, future, cryptocurrency]
        sector:
          type: string
          nullable: true
          description: Normalized provider sector; stocks without metadata use Unknown.
        exchange:
          type: string
          nullable: true
          description: Normalized provider exchange when available.
        exchangeTimezone:
          type: string
          nullable: true
          description: IANA timezone for a supported listed-exchange calendar, used to display the next open; null when unavailable.
        marketCapUsd:
          type: number
          nullable: true
          description: Provider market capitalization in USD. ETF assets-under-management are not substituted.
        annualizedVolatilityPercent:
          type: number
          nullable: true
          description: Trailing-year annualized standard deviation of daily returns, requiring at least 60 observations.
        riskBand:
          type: string
          enum: [Conservative, Moderate Conservative, Moderate, Moderate Aggressive, Aggressive]
          nullable: true
          description: Historical-volatility band; not personalized investment suitability.
      required:
        - symbol
        - name
        - price
        - priceChangePercent
        - returnPercent
        - returnBasis
        - returnUnavailableReason
        - historyStartDate
        - priceTimestamp
        - marketSession
        - nextRegularOpenTimestamp
        - assetType
        - sector
        - exchange
        - exchangeTimezone
        - marketCapUsd
        - annualizedVolatilityPercent
        - riskBand

    HeatMapResponse:
      type: object
      properties:
        category:
          type: string
          enum: [stocks, etfs, commodities, futures, cryptocurrency, custom]
        period:
          type: string
          enum: [1d, 1w, 1m, 3m, 6m, 1y, 3y, 5y, max]
        requestedSector:
          type: string
          enum: [Technology, Communication Services, Consumer Cyclical, Consumer Defensive, Financials, Healthcare, Industrials, Real Estate, Energy, Utilities, Basic Materials]
          nullable: true
          description: Sector used for a Stocks expansion request, or null for the normal category list.
        quotes:
          type: array
          items:
            $ref: "#/components/schemas/HeatMapQuote"
        unavailableSymbols:
          type: array
          items:
            type: string
        updatedAt:
          type: integer
          description: Unix timestamp in seconds when this batch was assembled.
      required:
        - category
        - period
        - requestedSector
        - quotes
        - unavailableSymbols
        - updatedAt

    MarketPulseResponse:
      type: object
      properties:
        marketOpen:
          type: boolean
          description: Whether the XNYS regular trading session is currently open.
        changePercent:
          type: number
          description: Daily percentage move from the previous close, in percentage points.
        priceTimestamp:
          type: integer
          description: Unix timestamp in seconds for the Yahoo Finance quote used to calculate the daily move.
        updatedAt:
          type: integer
          description: Unix timestamp in seconds when this response was assembled.
      required:
        - marketOpen
        - changePercent
        - priceTimestamp
        - updatedAt

    ValidateHeatMapSymbolRequest:
      type: object
      properties:
        symbol:
          type: string
          minLength: 1
          maxLength: 15
          pattern: "^[A-Za-z0-9.^=-]+$"
      required:
        - symbol

    AnalysisError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        reason:
          type: string
          description: Why a supported commodity has no score because its dated price history is stale or unreliable.
        lastUsableDate:
          type: string
          format: date
          nullable: true
          description: Latest valid daily observation date, when one was available.
      required:
        - error
        - message
