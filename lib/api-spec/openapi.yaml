      required: [topHoldings, sectorWeights, sectorWeightsRetrievedAt, topHoldingsReportedCount, topHoldingsRetrievedAt, marketRegime, benchmark, trackingComparison, peerExpenseComparison, peerAssetSizeComparison, scenarios, risks, strengths, analysis, provider, asOf, annualizedReturn, annualizedVolatility, maxDrawdown, riskAdjustedReturn, topHoldingsCombinedWeight]

    EtfScenario:
      type: object
      properties:
        label:
          type: string
          enum: [bear, base, bull]
        annualReturnAssumption:
          type: number
          nullable: true
          description: Historical regime average used as an illustrative annual return assumption.
        fiveYearValue:
          type: number
          nullable: true
        tenYearValue:
          type: number
          nullable: true
        assumption:
          type: string
      required: [label, annualReturnAssumption, fiveYearValue, tenYearValue, assumption]

    CryptoSupplyHistory:
      type: object
      description: Provider-reported daily on-chain current-supply observations. This series is distinct from the live circulating-supply and maximum-supply-share statistics.
      properties:
        symbol:
          type: string
        provider:
          type: string
          enum: ["Coin Metrics"]
        metric:
          type: string
          enum: [SplyCur]
        rangeDays:
          type: integer
          enum: [30, 90, 365]
        interval:
          type: string
          enum: [daily]
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        points:
          type: array
          items:
            $ref: "#/components/schemas/CryptoSupplyHistoryPoint"
      required:
        - symbol
        - provider
        - metric
        - rangeDays
        - interval
        - startDate
        - endDate
        - points

    CryptoSupplyHistoryPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        supply:
          type: number
          exclusiveMinimum: 0
      required:
        - date
        - supply

    MarketInstrumentInfo:
      type: object
      properties:
        symbol:
          type: string
        companyName:
          type: string
        sector:
          type: string
        industry:
          type: string
        exchange:
          type: string
        dividendYield:
