        matchedEndDate: { type: string, format: date, nullable: true }
        rankObservations: { type: integer, minimum: 0 }
        rankStartDate: { type: string, format: date, nullable: true }
        rankEndDate: { type: string, format: date, nullable: true }
        minWindowObservations: { type: integer, minimum: 0 }
        maxWindowObservations: { type: integer, minimum: 0 }
        points:
