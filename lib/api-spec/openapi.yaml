openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stocks
    description: Stock analysis operations
paths:
  /stocks/heat-map/search:
    get:
      operationId: searchHeatMapInstruments
      tags: [stocks]
      summary: Search supported non-stock heat-map instruments by name or ticker
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
        - in: query
          name: category
          required: true
          schema:
            type: string
            enum: [etfs, commodities, futures, cryptocurrency]
      responses:
        "200":
          description: Matching provider-supported instruments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeatMapInstrumentSuggestion"
        "400":
          description: Search text or category is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "502":
          description: The upstream instrument search is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stocks/search:
    get:
      operationId: searchStockSymbols
      tags: [stocks]
      summary: Search stocks by company name or ticker
      description: Returns matching listed equities for company-name and ticker autocomplete
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Matching stock symbols
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockSymbolSuggestion"
        "400":
          description: Search text is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "502":
          description: The upstream company search is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/analyze:
    post:
      operationId: analyzeStock
      tags: [stocks]
      summary: Analyze a stock or ETF ticker
      description: Detects ETFs and returns fund-specific analysis; listed stocks retain technical, fundamental, behavioral, and rules-based recommendation analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeStockRequest"
      responses:
        "200":
          description: Stock or fund-specific ETF analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Invalid symbol or request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "422":
          description: Could not analyze stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/info/{symbol}:
    get:
      operationId: getStockInfo
      tags: [stocks]
      summary: Get market detail statistics for a symbol
      description: Returns provider-backed quote statistics and, for ETFs, fund facts and historical market-regime comparisons.
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 15
      responses:
        "200":
          description: Market detail statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketInstrumentInfo"
        "400":
          description: Symbol is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "422":
          description: Provider data is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/crypto/{symbol}/supply-history/{rangeDays}:
    get:
      operationId: getCryptoSupplyHistory
      tags: [stocks]
      summary: Get historical on-chain supply for a cryptocurrency
      description: Returns daily Coin Metrics current-supply observations for a selected 30, 90, or 365 day window. Missing provider dates are omitted, never interpolated; this on-chain metric may differ from another provider's current circulating-supply figure.
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
            minLength: 5
            maxLength: 15
            pattern: "^[A-Z0-9]+-USD$"
        - in: path
          name: rangeDays
          required: true
          description: Number of daily history days to return.
          schema:
            type: integer
            enum: [30, 90, 365]
      responses:
        "200":
          description: Daily provider history, or an empty point list when the provider has no history for this asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoSupplyHistory"
        "400":
          description: Symbol is invalid or the requested history window is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "422":
          description: Historical supply provider is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/market-breadth:
    get:
      operationId: getMarketBreadth
      tags: [stocks]
      summary: Get a fast stock-market breadth snapshot
      description: Returns the regular-session daily price changes for the same active-stock sample as the heat map, without fetching historical series or volatility data.
      responses:
        "200":
          description: Current market breadth quotes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatMapResponse"
        "422":
          description: Market breadth is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/market-pulse:
    get:
      operationId: getMarketPulse
      tags: [stocks]
      summary: Get the total-market daily move
      description: Returns the daily percentage change and quote timestamp for Yahoo Finance's Dow Jones U.S. Total Stock Market Index (^DWCF), plus whether the official XNYS regular session is open. The index price is not returned.
      responses:
        "200":
          description: Total-market daily percentage move
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPulseResponse"
        "422":
          description: Market pulse is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/heat-map:
    get:
      operationId: getMarketHeatMap
      tags: [stocks]
      summary: Get batched quotes for a market heat map
      description: Returns a cached batch of quotes, selected-period returns, and available provider metadata for one heat-map category. Custom maps pass symbols as a comma-separated query array.
      parameters:
        - in: query
          name: category
          required: true
          schema:
            type: string
            enum: [stocks, etfs, commodities, futures, cryptocurrency, custom]
        - in: query
          name: period
          required: false
          schema:
            type: string
            enum: [1d, 1w, 1m, 3m, 6m, 1y, 3y, 5y, max]
            default: 1d
          description: Return window. Risk levels always use trailing-year annualized daily volatility.
        - in: query
          name: sector
          required: false
          schema:
            type: string
            enum: [Technology, Communication Services, Consumer Cyclical, Consumer Defensive, Financials, Healthcare, Industrials, Real Estate, Energy, Utilities, Basic Materials]
          description: For Stocks, fetch an expanded, liquid US-listed quote set for the selected sector.
        - in: query
          name: symbols
          required: false
          style: form
          explode: false
          schema:
            type: array
            maxItems: 40
            items:
              type: string
              minLength: 1
              maxLength: 15
      responses:
        "200":
          description: Market quotes for the selected heat map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatMapResponse"
        "400":
          description: Invalid category or custom ticker list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "422":
          description: Market data is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stocks/heat-map/validate:
    post:
      operationId: validateHeatMapSymbol
      tags: [stocks]
      summary: Validate a custom heat-map ticker against live market data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateHeatMapSymbolRequest"
      responses:
        "200":
          description: Valid ticker with an available quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatMapQuote"
        "400":
          description: Invalid ticker syntax
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "422":
          description: No current or recent quote was found, or market data is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AnalyzeStockRequest:
      type: object
      properties:
        symbol:
          type: string
          description: Stock ticker symbol (e.g. AAPL, TSLA, MSFT)
      required:
        - symbol

    StockSymbolSuggestion:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        exchange:
          type: string
      required:
        - symbol
        - name
        - exchange

    HeatMapInstrumentSuggestion:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        exchange:
          type: string
        category:
          type: string
          enum: [etf, commodity, future, cryptocurrency]
      required:
        - symbol
        - name
        - exchange
        - category

    TechnicalAnalysis:
      type: object
      properties:
        rsi:
          type: number
          description: Relative Strength Index (0-100)
        macdSignal:
          type: string
          enum: [bullish, bearish, neutral]
        trend:
          type: string
          enum: [uptrend, downtrend, sideways]
        support:
          type: number
        resistance:
          type: number
        ma20:
          type: number
        ma50:
          type: number
        ma200:
          type: number
        bollingerUpper:
          type: number
        bollingerLower:
          type: number
        bollingerMiddle:
          type: number
        volumeRatio:
          type: number
          description: Current volume / average volume
        score:
          type: number
          description: Technical score 0-100
      required:
        - rsi
        - macdSignal
        - trend
        - support
        - resistance
        - ma20
        - ma50
        - ma200
        - bollingerUpper
        - bollingerLower
        - bollingerMiddle
        - volumeRatio
        - score

    FundamentalAnalysis:
      type: object
      properties:
        pe:
          type: number
          nullable: true
        pb:
          type: number
          nullable: true
        eps:
          type: number
          nullable: true
        revenueGrowth:
          type: number
          nullable: true
          description: Year-over-year revenue growth as decimal (0.15 = 15%)
        earningsGrowth:
          type: number
          nullable: true
        debtEquity:
          type: number
          nullable: true
        dividendYield:
          type: number
          nullable: true
        profitMargin:
          type: number
          nullable: true
        returnOnEquity:
          type: number
          nullable: true
        score:
          type: number
          description: Fundamental score 0-100
      required:
        - score

    BehavioralAnalysis:
      type: object
      properties:
        analystRating:
          type: string
          description: Consensus analyst rating
        analystCount:
          type: number
        priceTarget:
          type: number
          nullable: true
        shortInterest:
          type: number
          nullable: true
          description: Short interest as decimal
        insiderSentiment:
          type: string
          enum: [positive, negative, neutral]
        buyCount:
          type: number
        holdCount:
          type: number
        sellCount:
          type: number
        score:
          type: number
          description: Behavioral/sentiment score 0-100
      required:
        - analystRating
        - analystCount
        - insiderSentiment
        - buyCount
        - holdCount
        - sellCount
        - score

    Recommendation:
      type: object
      properties:
        action:
          type: string
          enum: [buy, sell, hold]
        buyPrice:
          type: number
          nullable: true
          description: Recommended price to buy / add position
        sellPrice:
          type: number
          nullable: true
          description: Price target / recommended exit
        stopLoss:
          type: number
          nullable: true
          description: Stop-loss price level
        confidence:
          type: number
          description: Confidence level 0-100
        timeHorizon:
          type: string
          description: Recommended holding period (e.g. "3-6 months")
        reasoning:
          type: string
          description: Full AI-generated analysis and reasoning
        risks:
          type: array
          items:
            type: string
        strengths:
          type: array
          items:
            type: string
      required:
        - action
        - confidence
        - timeHorizon
        - reasoning
        - risks
        - strengths

    StockAnalysis:
      type: object
      properties:
        assetType:
          type: string
          enum: [stock]
        symbol:
          type: string
        companyName:
          type: string
        exchange:
          type: string
        currency:
          type: string
        currentPrice:
          type: number
        priceChange:
          type: number
        priceChangePercent:
          type: number
        volume:
          type: number
        marketCap:
          type: number
          nullable: true
        week52High:
          type: number
        week52Low:
          type: number
        technical:
          $ref: "#/components/schemas/TechnicalAnalysis"
        fundamental:
          $ref: "#/components/schemas/FundamentalAnalysis"
        behavioral:
          $ref: "#/components/schemas/BehavioralAnalysis"
        recommendation:
          $ref: "#/components/schemas/Recommendation"
      required:
        - assetType
        - symbol
        - companyName
        - exchange
        - currency
        - currentPrice
        - priceChange
        - priceChangePercent
        - volume
        - week52High
        - week52Low
        - technical
        - fundamental
        - behavioral
        - recommendation

    AnalysisResult:
      oneOf:
        - $ref: "#/components/schemas/StockAnalysis"
        - $ref: "#/components/schemas/EtfAnalysisResult"
      discriminator:
        propertyName: assetType
        mapping:
          stock: "#/components/schemas/StockAnalysis"
          etf: "#/components/schemas/EtfAnalysisResult"

    EtfAnalysisResult:
      type: object
      properties:
        assetType:
          type: string
          enum: [etf]
        symbol: { type: string }
        companyName: { type: string }
        exchange: { type: string }
        currency: { type: string }
        currentPrice: { type: number }
        priceChange: { type: number }
        priceChangePercent: { type: number }
        volume: { type: number }
        marketCap:
          type: number
          nullable: true
        week52High: { type: number }
        week52Low: { type: number }
        etfAnalysis:
          $ref: "#/components/schemas/EtfAnalysis"
      required: [assetType, symbol, companyName, exchange, currency, currentPrice, priceChange, priceChangePercent, volume, week52High, week52Low, etfAnalysis]

    EtfAnalysis:
      type: object
      description: Fund-specific provider data, historical comparisons, and illustrative scenarios. Null means unavailable.
      properties:
        fundCategory:
          type: string
          nullable: true
        fundFamily:
          type: string
          nullable: true
        expenseRatio:
          type: number
          nullable: true
        totalAssets:
          type: number
          nullable: true
        dividendYield:
          type: number
          nullable: true
        beta3Year:
          type: number
          nullable: true
        averageVolume:
          type: number
          nullable: true
        topHoldingsCombinedWeight:
          type: number
          nullable: true
        annualizedReturn:
          type: number
          nullable: true
        annualizedVolatility:
          type: number
          nullable: true
        maxDrawdown:
          type: number
          nullable: true
        riskAdjustedReturn:
          type: number
          nullable: true
        topHoldings:
          type: array
          items:
            $ref: "#/components/schemas/EtfHolding"
        sectorWeights:
          type: array
          description: Provider-reported sector weights only; omitted sectors are not inferred as zero.
          items:
            $ref: "#/components/schemas/EtfSectorWeight"
        sectorWeightsRetrievedAt:
          type: string
          format: date-time
        topHoldingsReportedCount:
          type: integer
          minimum: 0
        topHoldingsRetrievedAt:
          type: string
          format: date-time
        marketRegime:
          allOf:
            - $ref: "#/components/schemas/EtfMarketRegime"
          nullable: true
        benchmark:
          allOf:
            - $ref: "#/components/schemas/EtfBenchmarkReference"
          nullable: true
        trackingComparison:
          allOf:
            - $ref: "#/components/schemas/EtfTrackingComparison"
          nullable: true
        peerExpenseComparison:
          allOf:
            - $ref: "#/components/schemas/EtfPeerExpenseComparison"
          nullable: true
        peerAssetSizeComparison:
          allOf:
            - $ref: "#/components/schemas/EtfPeerAssetSizeComparison"
          nullable: true
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/EtfScenario"
        risks:
          type: array
          items:
            type: string
        strengths:
          type: array
          items:
            type: string
        analysis:
          type: string
        provider:
          type: string
        asOf:
          type: string
          format: date-time
      required: [topHoldings, sectorWeights, sectorWeightsRetrievedAt, topHoldingsReportedCount, topHoldingsRetrievedAt, marketRegime, benchmark, trackingComparison, peerExpenseComparison, peerAssetSizeComparison, scenarios, risks, strengths, analysis, provider, asOf, annualizedReturn, annualizedVolatility, maxDrawdown, riskAdjustedReturn, topHoldingsCombinedWeight]

    EtfScenario:
      type: object
      properties:
        label:
          type: string
          enum: [bear, base, bull]
        annualReturnAssumption:
          type: number
          nullable: true
          description: Historical regime average used as an illustrative annual return assumption.
        fiveYearValue:
          type: number
          nullable: true
        tenYearValue:
          type: number
          nullable: true
        assumption:
          type: string
      required: [label, annualReturnAssumption, fiveYearValue, tenYearValue, assumption]

    CryptoSupplyHistory:
      type: object
      description: Provider-reported daily on-chain current-supply observations. This series is distinct from the live circulating-supply and maximum-supply-share statistics.
      properties:
        symbol:
          type: string
        provider:
          type: string
          enum: ["Coin Metrics"]
        metric:
          type: string
          enum: [SplyCur]
        rangeDays:
          type: integer
          enum: [30, 90, 365]
        interval:
          type: string
          enum: [daily]
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        points:
          type: array
          items:
            $ref: "#/components/schemas/CryptoSupplyHistoryPoint"
      required:
        - symbol
        - provider
        - metric
        - rangeDays
        - interval
        - startDate
        - endDate
        - points

    CryptoSupplyHistoryPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        supply:
          type: number
          exclusiveMinimum: 0
      required:
        - date
        - supply

    MarketInstrumentInfo:
      type: object
      properties:
        symbol:
          type: string
        companyName:
          type: string
        sector:
          type: string
        industry:
          type: string
        exchange:
          type: string
        dividendYield:
          type: number
          nullable: true
          description: Distribution yield as a decimal fraction (0.01 = 1%).
        dividendRate:
          type: number
          nullable: true
        marketCap:
          type: number
          nullable: true
        currentPrice:
          type: number
        previousClose:
          type: number
          nullable: true
        open:
          type: number
          nullable: true
        dayLow:
          type: number
          nullable: true
        dayHigh:
          type: number
          nullable: true
        fiftyTwoWeekLow:
          type: number
          nullable: true
        fiftyTwoWeekHigh:
          type: number
          nullable: true
        volume:
          type: number
          nullable: true
        averageVolume3Month:
          type: number
          nullable: true
        beta:
          type: number
          nullable: true
        earningsTimestamp:
          type: number
          nullable: true
        targetMeanPrice:
          type: number
          nullable: true
        trailingEps:
          type: number
          nullable: true
        totalRevenue:
          type: number
          nullable: true
        circulatingSupply:
          type: number
          nullable: true
        maxSupply:
          type: number
          nullable: true
        volume24Hr:
          type: number
          nullable: true
        etfProfile:
          $ref: "#/components/schemas/EtfProfile"
      required:
        - symbol
        - companyName
        - sector
        - industry
        - exchange
        - dividendYield
        - dividendRate
        - marketCap
        - currentPrice
        - previousClose
        - open
        - dayLow
        - dayHigh
        - fiftyTwoWeekLow
        - fiftyTwoWeekHigh
        - volume
        - averageVolume3Month
        - beta
        - earningsTimestamp
        - targetMeanPrice
        - trailingEps
        - totalRevenue
        - circulatingSupply
        - maxSupply
        - volume24Hr

    EtfProfile:
      type: object
      description: Provider-reported fund facts, present for ETFs. Ratios and weights are decimal fractions.
      properties:
        fundCategory:
          type: string
          nullable: true
        fundFamily:
          type: string
          nullable: true
        expenseRatio:
          type: number
          nullable: true
          description: Annual expense ratio as a decimal fraction (0.001 = 0.1%).
        totalAssets:
          type: number
          nullable: true
          description: Fund assets under management in USD.
        dividendYield:
          type: number
          nullable: true
        beta3Year:
          type: number
          nullable: true
        largestSector:
          type: string
          nullable: true
        largestSectorWeight:
          type: number
          nullable: true
        sectorWeights:
          type: array
          description: Provider-reported sector weights only; omitted sectors are not inferred as zero.
          items:
            $ref: "#/components/schemas/EtfSectorWeight"
        sectorWeightsRetrievedAt:
          type: string
          format: date-time
        topHoldings:
          type: array
          items:
            $ref: "#/components/schemas/EtfHolding"
        topHoldingsReportedCount:
          type: integer
          minimum: 0
        topHoldingsRetrievedAt:
          type: string
          format: date-time
        marketRegime:
          allOf:
            - $ref: "#/components/schemas/EtfMarketRegime"
          nullable: true
        benchmark:
          allOf:
            - $ref: "#/components/schemas/EtfBenchmarkReference"
          nullable: true
        trackingComparison:
          allOf:
            - $ref: "#/components/schemas/EtfTrackingComparison"
          nullable: true
        peerExpenseComparison:
          allOf:
            - $ref: "#/components/schemas/EtfPeerExpenseComparison"
          nullable: true
        peerAssetSizeComparison:
          allOf:
            - $ref: "#/components/schemas/EtfPeerAssetSizeComparison"
          nullable: true
      required:
        - fundCategory
        - fundFamily
        - expenseRatio
        - totalAssets
        - dividendYield
        - beta3Year
        - largestSector
        - largestSectorWeight
        - sectorWeights
        - sectorWeightsRetrievedAt
        - topHoldings
        - topHoldingsReportedCount
        - topHoldingsRetrievedAt
        - marketRegime
        - benchmark
        - trackingComparison
        - peerExpenseComparison
        - peerAssetSizeComparison

    EtfBenchmarkReference:
      type: object
      description: Benchmark explicitly identified by the provider; never inferred from the ETF category.
      properties:
        symbol: { type: string }
        name: { type: string }
        source: { type: string }
        asOf: { type: string, format: date-time }
      required: [symbol, name, source, asOf]

    EtfTrackingComparison:
      type: object
      description: Comparison of adjusted monthly ETF and explicit benchmark returns over their shared history.
      properties:
        periodStart: { type: string }
        periodEnd: { type: string }
        monthlySamples: { type: integer, minimum: 2 }
        fundAnnualizedReturn: { type: number }
        benchmarkAnnualizedReturn: { type: number }
        trackingDifference:
          type: number
          description: Fund annualized total return minus benchmark annualized total return.
        trackingError:
          type: number
          description: Sample standard deviation of monthly active returns, annualized by the square root of 12.
        source: { type: string }
        asOf: { type: string, format: date-time }
      required: [periodStart, periodEnd, monthlySamples, fundAnnualizedReturn, benchmarkAnnualizedReturn, trackingDifference, trackingError, source, asOf]

    EtfPeerExpenseComparison:
      type: object
      description: Yahoo Finance provider-defined fund-category average; sample size is unavailable when not reported.
      properties:
        category: { type: string }
        fundExpenseRatio:
          type: number
          nullable: true
          description: Fund annual expense ratio as a decimal fraction.
        categoryAverageExpenseRatio:
          type: number
          description: Category-average annual expense ratio as a decimal fraction.
        difference:
          type: number
          nullable: true
          description: Fund expense ratio minus the category average, as a decimal fraction.
        sampleSize:
          type: integer
          nullable: true
        sampleContext: { type: string }
        source: { type: string }
        asOf: { type: string, format: date-time }
      required: [category, fundExpenseRatio, categoryAverageExpenseRatio, difference, sampleSize, sampleContext, source, asOf]

    EtfPeerAssetSizeComparison:
      type: object
      description: Yahoo Finance provider-defined category average total net assets; sample size is unavailable when not reported.
      properties:
        category: { type: string }
        fundTotalAssets:
          type: number
          nullable: true
          description: Fund total net assets in USD.
        categoryAverageTotalAssets:
          type: number
          description: Category-average total net assets in USD.
        difference:
          type: number
          nullable: true
          description: Fund total assets minus the category average, in USD.
        sampleSize:
          type: integer
          nullable: true
        sampleContext: { type: string }
        source: { type: string }
        asOf: { type: string, format: date-time }
      required: [category, fundTotalAssets, categoryAverageTotalAssets, difference, sampleSize, sampleContext, source, asOf]

    EtfHolding:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        weight:
          type: number
          description: Holding weight as a decimal fraction.
      required:
        - symbol
        - name
        - weight

    EtfSectorWeight:
      type: object
      properties:
        sector:
          type: string
        weight:
          type: number
          minimum: 0
          maximum: 1
          description: Provider-reported sector weight as a decimal fraction.
      required: [sector, weight]

    EtfMarketRegime:
      type: object
      description: Historical comparison, not a forecast. Based on complete calendar-year adjusted total returns.
      properties:
        bestRegime:
          type: string
          enum: [bull, bear, mixed]
          nullable: true
        lookbackYears:
          type: integer
        firstYear:
          type: integer
        lastYear:
          type: integer
        benchmarkSymbol:
          type: string
        bullThreshold:
          type: number
          description: Minimum annual benchmark return for a bull year, as a decimal fraction.
        bearThreshold:
          type: number
          description: Maximum annual benchmark return for a bear year, as a decimal fraction.
        periods:
          type: object
          properties:
            bull:
              $ref: "#/components/schemas/EtfRegimePeriod"
            bear:
              $ref: "#/components/schemas/EtfRegimePeriod"
            mixed:
              $ref: "#/components/schemas/EtfRegimePeriod"
          required: [bull, bear, mixed]
      required:
        - bestRegime
        - lookbackYears
        - firstYear
        - lastYear
        - benchmarkSymbol
        - bullThreshold
        - bearThreshold
        - periods

    EtfRegimePeriod:
      type: object
      properties:
        averageAnnualReturn:
          type: number
          nullable: true
          description: Arithmetic average of adjusted annual total returns.
        years:
          type: integer
          description: Number of complete calendar years in this regime.
      required:
        - averageAnnualReturn
        - years

    HeatMapQuote:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
          exclusiveMinimum: 0
        priceChangePercent:
          type: number
          description: Percentage change from the previous close, in percentage points (1.25 means 1.25%).
        returnPercent:
          type: number
          nullable: true
          description: Selected-period return in percentage points, or null when the requested history is unavailable.
        returnBasis:
          type: string
          enum: [adjusted_total_return, price_return_proxy]
          description: Adjusted total return for stocks/ETFs where supported, otherwise a price-return proxy.
        returnUnavailableReason:
          type: string
          nullable: true
          description: Why the requested return could not be calculated.
        historyStartDate:
          type: string
          nullable: true
          description: Earliest available daily observation in YYYY-MM-DD; populated for Max.
        priceTimestamp:
          type: integer
          nullable: true
          description: Unix timestamp in seconds for this quote or last available close. Quotes without a timestamp are not displayable.
        marketSession:
          type: string
          enum: [pre_market, regular, after_hours, closed, unknown]
          description: Session for this quote. closed identifies the latest available close; unknown means the provider could not identify the session.
        nextRegularOpenTimestamp:
          type: integer
          nullable: true
          description: Unix timestamp in seconds for the next scheduled listed-exchange regular-session open, populated only when a stock or ETF is closed or in after-hours; null when unavailable or not applicable.
        assetType:
          type: string
          enum: [stock, etf, commodity, future, cryptocurrency]
        sector:
          type: string
          nullable: true
          description: Normalized provider sector; stocks without metadata use Unknown.
        exchange:
          type: string
          nullable: true
          description: Normalized provider exchange when available.
        exchangeTimezone:
          type: string
          nullable: true
          description: IANA timezone for a supported listed-exchange calendar, used to display the next open; null when unavailable.
        marketCapUsd:
          type: number
          nullable: true
          description: Provider market capitalization in USD. ETF assets-under-management are not substituted.
        annualizedVolatilityPercent:
          type: number
          nullable: true
          description: Trailing-year annualized standard deviation of daily returns, requiring at least 60 observations.
        riskBand:
          type: string
          enum: [Conservative, Moderate Conservative, Moderate, Moderate Aggressive, Aggressive]
          nullable: true
          description: Historical-volatility band; not personalized investment suitability.
      required:
        - symbol
        - name
        - price
        - priceChangePercent
        - returnPercent
        - returnBasis
        - returnUnavailableReason
        - historyStartDate
        - priceTimestamp
        - marketSession
        - nextRegularOpenTimestamp
        - assetType
        - sector
        - exchange
        - exchangeTimezone
        - marketCapUsd
        - annualizedVolatilityPercent
        - riskBand

    HeatMapResponse:
      type: object
      properties:
        category:
          type: string
          enum: [stocks, etfs, commodities, futures, cryptocurrency, custom]
        period:
          type: string
          enum: [1d, 1w, 1m, 3m, 6m, 1y, 3y, 5y, max]
        requestedSector:
          type: string
          enum: [Technology, Communication Services, Consumer Cyclical, Consumer Defensive, Financials, Healthcare, Industrials, Real Estate, Energy, Utilities, Basic Materials]
          nullable: true
          description: Sector used for a Stocks expansion request, or null for the normal category list.
        quotes:
          type: array
          items:
            $ref: "#/components/schemas/HeatMapQuote"
        unavailableSymbols:
          type: array
          items:
            type: string
        updatedAt:
          type: integer
          description: Unix timestamp in seconds when this batch was assembled.
      required:
        - category
        - period
        - requestedSector
        - quotes
        - unavailableSymbols
        - updatedAt

    MarketPulseResponse:
      type: object
      properties:
        marketOpen:
          type: boolean
          description: Whether the XNYS regular trading session is currently open.
        changePercent:
          type: number
          description: Daily percentage move from the previous close, in percentage points.
        priceTimestamp:
          type: integer
          description: Unix timestamp in seconds for the Yahoo Finance quote used to calculate the daily move.
        updatedAt:
          type: integer
          description: Unix timestamp in seconds when this response was assembled.
      required:
        - marketOpen
        - changePercent
        - priceTimestamp
        - updatedAt

    ValidateHeatMapSymbolRequest:
      type: object
      properties:
        symbol:
          type: string
          minLength: 1
          maxLength: 15
          pattern: "^[A-Za-z0-9.^=-]+$"
      required:
        - symbol

    AnalysisError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
